name: Build and Publish OPA Bundle

on:
  push:
    branches:
      - main
    paths:
      - "policies/**"
      - ".github/workflows/bundle.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Check Rego syntax (opa check --strict)
        run: opa check --strict policies/

      - name: Setup Regal
        uses: open-policy-agent/setup-regal@v1
        with:
          version: latest

      - name: Lint Rego policies (regal)
        run: regal lint --format github policies/

      - name: Detect changed policy directories
        id: changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: rebuilding all bundles"
            echo "rebuild_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only HEAD~1 | grep -q '.github/workflows/bundle.yaml'; then
            echo "Workflow file changed: rebuilding all bundles"
            echo "rebuild_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only HEAD~1 -- policies/ \
            | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "Changed policy directories: ${changed}"
          echo "changed_dirs=${changed}" >> "$GITHUB_OUTPUT"
          echo "rebuild_all=false" >> "$GITHUB_OUTPUT"

      - name: Build bundles
        env:
          PAGES_BASE: https://zjleblanc.github.io/autodotes-policy
          REBUILD_ALL: ${{ steps.changes.outputs.rebuild_all }}
          CHANGED_DIRS: ${{ steps.changes.outputs.changed_dirs }}
        run: |
          set -euo pipefail
          mkdir -p _site/bundles

          shopt -s nullglob
          dirs=(policies/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No policy directories found under policies/" >&2
            exit 1
          fi

          for dir in "${dirs[@]}"; do
            name="$(basename "${dir%/}")"
            out="_site/bundles/${name}.bundle.tar.gz"

            if [ "${REBUILD_ALL}" = "true" ] || grep -qw "${name}" <<< "${CHANGED_DIRS}"; then
              echo "Building bundle '${name}' from ${dir} -> ${out} (changed)"
              opa build -b "${dir}" -o "${out}"
            else
              echo "Fetching existing bundle '${name}' from Pages (unchanged)"
              if curl -fsSL -R "${PAGES_BASE}/bundles/${name}.bundle.tar.gz" -o "${out}"; then
                echo "  -> reused existing bundle for '${name}'"
              else
                echo "  -> fetch failed for '${name}', building from source"
                opa build -b "${dir}" -o "${out}"
              fi
            fi
          done

          echo "Final bundles:"
          ls -la _site/bundles

      - name: Write Pages index
        env:
          PAGES_BASE: https://zjleblanc.github.io/autodotes-policy
        run: |
          python3 - <<'PY'
          import html
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          site = Path("_site")
          bundle_dir = site / "bundles"
          files = sorted(
              p for p in bundle_dir.iterdir()
              if p.is_file() and p.name.endswith(".bundle.tar.gz")
          )

          root = urlparse(os.environ["PAGES_BASE"]).path
          if not root.endswith("/"):
              root += "/"
          site_name = root.strip("/") or "index"

          opa_icon = "data:image/png;base64,"

          document = """<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>@@TITLE@@</title>
              <style>
                  :root { color-scheme: dark; }
                  body {
                      margin: 0;
                      padding: 1.5rem;
                      background: #000;
                      color: #bfbfbf;
                      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                  }
                  .crumbs {
                      display: flex;
                      flex-wrap: wrap;
                      align-items: center;
                      max-width: 52rem;
                      margin: 0 0 1rem;
                      padding: 0 0 0.75rem;
                      list-style: none;
                      font-size: 1.75rem;
                      font-weight: 500;
                      line-height: 1.2;
                      border-bottom: 1px solid #40494b;
                  }
                  .crumb { display: inline-flex; align-items: center; color: #d4dbdd; }
                  .crumb + .crumb { padding-left: 0.5rem; }
                  .crumb + .crumb::before {
                      content: "/";
                      padding-right: 0.5rem;
                      color: #81949c;
                      font-weight: 400;
                  }
                  .crumb a { color: #d4dbdd; text-decoration: none; }
                  .crumb a:hover { color: #f8f8f8; }
                  .crumb.current { color: #f8f8f8; }
                  .home-icon { width: 1.15em; height: 1.15em; display: block; fill: currentColor; }
                  .clip {
                      position: absolute;
                      width: 1px;
                      height: 1px;
                      padding: 0;
                      margin: -1px;
                      overflow: hidden;
                      clip: rect(0, 0, 0, 0);
                      white-space: nowrap;
                      border: 0;
                  }
                  .table-wrap {
                      max-width: 52rem;
                      overflow: auto;
                      border: 1px solid #40494b;
                      border-radius: 0.75rem;
                  }
                  .files {
                      width: 100%;
                      border-collapse: collapse;
                  }
                  .files th,
                  .files td {
                      padding: 0.75rem 1rem;
                      text-align: left;
                      vertical-align: middle;
                  }
                  .files th {
                      color: #f8f8f8;
                      font-weight: 600;
                      background: #121617;
                      border-bottom: 1px solid #5b686b;
                  }
                  .files tbody tr:nth-child(odd) { background: #1c2426; }
                  .files tbody tr:nth-child(even) { background: #2a3336; }
                  .files tbody tr:hover { background: #343e41; }
                  .files .size,
                  .files .modified {
                      text-align: right;
                      white-space: nowrap;
                      color: #81949c;
                      font-variant-numeric: tabular-nums;
                  }
                  .files th.size,
                  .files th.modified,
                  .files th.download { color: #f8f8f8; }
                  .files .download { width: 1%; text-align: center; white-space: nowrap; }
                  .download a {
                      display: inline-flex;
                      color: #d4dbdd;
                      text-decoration: none;
                  }
                  .download a:hover,
                  .download a:focus-visible { color: #f8f8f8; }
                  .download-icon { width: 1.25rem; height: 1.25rem; display: block; fill: currentColor; }
                  .file {
                      display: flex;
                      align-items: center;
                      gap: 0.75rem;
                      min-width: 12rem;
                  }
                  .opa { width: 2rem; height: 2rem; flex: none; }
                  .file a {
                      color: #d4dbdd;
                      text-decoration: none;
                      overflow-wrap: anywhere;
                  }
                  .file a:hover,
                  .file a:focus-visible { color: #f8f8f8; }
                  @media (max-width: 40rem) {
                      .crumbs { font-size: 1.35rem; }
                  }
              </style>
          </head>
          <body>
              <nav aria-label="Breadcrumb">
                  <ol class="crumbs">
          @@CRUMBS@@
                  </ol>
              </nav>
              <div class="table-wrap">
                  <table class="files">
                      <thead>
                          <tr>
                              <th class="name">Name</th>
                              <th class="size">Size</th>
                              <th class="modified">Last Modified</th>
                              <th class="download">Download</th>
                          </tr>
                      </thead>
                      <tbody>
          @@ROWS@@
                      </tbody>
                  </table>
              </div>
              <script>
                  document.querySelectorAll("time.local").forEach((node) => {
                      const date = new Date(node.dateTime);
                      if (Number.isNaN(date.getTime())) return;
                      node.textContent = date.toLocaleString(undefined, {
                          year: "numeric",
                          month: "short",
                          day: "numeric",
                          hour: "numeric",
                          minute: "2-digit",
                      });
                  });
              </script>
          </body>
          </html>
          """

          download_icon = (
              '<svg class="download-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true" focusable="false">'
              '<path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>'
              '<path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"/>'
              "</svg>"
          )

          home_icon = (
              '<svg class="home-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true" focusable="false">'
              '<path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-2a.5.5 0 0 0-.5.5v1.293z"/>'
              '<path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"/>'
              "</svg>"
          )

          def crumb_body(label, home):
              if not home:
                  return html.escape(label)
              return f'{home_icon}<span class="clip">{html.escape(label)}</span>'

          def crumbs_html(crumbs):
              parts = []
              for index, (label, href) in enumerate(crumbs):
                  last = index == len(crumbs) - 1
                  body = crumb_body(label, index == 0)
                  if last:
                      parts.append(
                          f'            <li class="crumb current" aria-current="page">{body}</li>'
                      )
                  elif not href:
                      parts.append(f'            <li class="crumb">{body}</li>')
                  else:
                      parts.append(
                          '            <li class="crumb">'
                          f'<a href="{html.escape(href, quote=True)}" aria-label="{html.escape(label, quote=True)}">{body}</a></li>'
                      )
              return "\n".join(parts)

          def rows_html(entries):
              blocks = []
              for name, href, size, mtime in entries:
                  modified = datetime.fromtimestamp(mtime, timezone.utc).isoformat().replace("+00:00", "Z")
                  blocks.append(
                      "\n".join(
                          [
                              "            <tr>",
                              "                <td>",
                              '                    <span class="file">',
                              f'                        <img class="opa" src="{opa_icon}" alt="" width="32" height="32">',
                              f'                        <a href="{html.escape(href, quote=True)}">{html.escape(name)}</a>',
                              "                    </span>",
                              "                </td>",
                              f'                <td class="size">{size} bytes</td>',
                              f'                <td class="modified"><time class="local" datetime="{modified}">{modified}</time></td>',
                              "                <td class=\"download\">",
                              f'                    <a href="{html.escape(href, quote=True)}" download="{html.escape(name, quote=True)}" aria-label="Download {html.escape(name, quote=True)}">{download_icon}</a>',
                              "                </td>",
                              "            </tr>",
                          ]
                      )
                  )
              return "\n".join(blocks)

          def render(crumbs, entries):
              title = " / ".join(label for label, _ in crumbs)
              return (
                  document.replace("@@TITLE@@", html.escape(title))
                  .replace("@@CRUMBS@@", crumbs_html(crumbs))
                  .replace("@@ROWS@@", rows_html(entries))
              )

          bundle_entries = []
          root_entries = []
          for path in files:
              st = path.stat()
              bundle_entries.append((path.name, path.name, st.st_size, st.st_mtime))
              root_entries.append((path.name, f"bundles/{path.name}", st.st_size, st.st_mtime))

          (site / "index.html").write_text(
              render([(site_name, None), ("bundles", None)], root_entries) + "\n"
          )
          (bundle_dir / "index.html").write_text(
              render([(site_name, "../"), ("bundles", None)], bundle_entries) + "\n"
          )
          print(f"Wrote {site / 'index.html'} and {bundle_dir / 'index.html'}")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
