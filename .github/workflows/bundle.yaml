name: Build and Publish OPA Bundle

on:
  push:
    branches:
      - main
    paths:
      - "policies/**"
      - "registry/**"
      - ".github/workflows/bundle.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Check Rego syntax (opa check --strict)
        run: opa check --strict policies/

      - name: Setup Regal
        uses: open-policy-agent/setup-regal@v1
        with:
          version: latest

      - name: Lint Rego policies (regal)
        run: regal lint --format github policies/

      - name: Detect changed policy directories
        id: changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: rebuilding all bundles"
            echo "rebuild_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only HEAD~1 | grep -q '.github/workflows/bundle.yaml'; then
            echo "Workflow file changed: rebuilding all bundles"
            echo "rebuild_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only HEAD~1 -- policies/ \
            | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "Changed policy directories: ${changed}"
          echo "changed_dirs=${changed}" >> "$GITHUB_OUTPUT"
          echo "rebuild_all=false" >> "$GITHUB_OUTPUT"

      - name: Build bundles
        env:
          PAGES_BASE: https://zjleblanc.github.io/autodotes-policy
          REBUILD_ALL: ${{ steps.changes.outputs.rebuild_all }}
          CHANGED_DIRS: ${{ steps.changes.outputs.changed_dirs }}
        run: |
          set -euo pipefail
          mkdir -p _site/bundles

          shopt -s nullglob
          dirs=(policies/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No policy directories found under policies/" >&2
            exit 1
          fi

          for dir in "${dirs[@]}"; do
            name="$(basename "${dir%/}")"
            out="_site/bundles/${name}.bundle.tar.gz"

            if [ "${REBUILD_ALL}" = "true" ] || grep -qw "${name}" <<< "${CHANGED_DIRS}"; then
              echo "Building bundle '${name}' from ${dir} -> ${out} (changed)"
              opa build -b "${dir}" -o "${out}"
            else
              echo "Fetching existing bundle '${name}' from Pages (unchanged)"
              if curl -fsSL -R "${PAGES_BASE}/bundles/${name}.bundle.tar.gz" -o "${out}"; then
                echo "  -> reused existing bundle for '${name}'"
              else
                echo "  -> fetch failed for '${name}', building from source"
                opa build -b "${dir}" -o "${out}"
              fi
            fi
          done

          echo "Final bundles:"
          ls -la _site/bundles

      - name: Write Pages index
        env:
          PAGES_BASE: https://zjleblanc.github.io/autodotes-policy
        run: python3 registry/generate_index.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
