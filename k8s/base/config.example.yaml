# Not deployed - for reference only.
# The live config is rendered by external-secret.yaml (config.yaml key).
# The JWT public key is rendered into the same Secret as data.json and
# mounted into /etc/opa/authz for io.jwt.decode_verify — not into config.
services:
  github-pages:
    url: https://zjleblanc.github.io/autodotes-policy

bundles:
  autodotes_policy:
    service: github-pages
    resource: bundles/autodotes_policy.bundle.tar.gz
    polling:
      min_delay_seconds: 30
      max_delay_seconds: 60
