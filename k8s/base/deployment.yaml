apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  labels:
    app: opa
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      containers:
        - name: opa
          image: docker.io/openpolicyagent/opa:latest
          args:
            - "run"
            - "--server"
            - "--addr"
            - ":8443"
            - "--tls-cert-file"
            - "/certs/tls.crt"
            - "--tls-private-key-file"
            - "/certs/tls.key"
            - "--config-file"
            - "/etc/opa/config.yaml"
            - "--authentication=token"
            - "--authorization=basic"
            # Pass files explicitly — loading the directory also picks up
            # Kubernetes projected-volume ..data / ..timestamp copies and
            # fails with "multiple default rules data.system.authz".
            - "/etc/opa/authz/authz.rego"
            - "/etc/opa/authz/data.json"
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/opa
              readOnly: true
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: authz
              mountPath: /etc/opa/authz
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          secret:
            secretName: opa-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: tls
          secret:
            secretName: opa-tls
        - name: authz
          projected:
            sources:
              - configMap:
                  name: opa-authz
              - secret:
                  name: opa-config
                  items:
                    - key: data.json
                      path: data.json
