apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: opa-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: opa-config
    template:
      engineVersion: v2
      data:
        config.yaml: |
          services:
            github-pages:
              url: https://zjleblanc.github.io/autodotes-policy

          bundles:
            autodotes_policy:
              service: github-pages
              resource: bundles/autodotes_policy.bundle.tar.gz
              polling:
                min_delay_seconds: 30
                max_delay_seconds: 60

        # Loaded as OPA data (data.system.jwt_cert) for inbound JWT verification.
        # dict + toJson quotes/escapes the PEM (newlines → \n) as a JSON string.
        data.json: |
          {{ dict "system" (dict "jwt_cert" .public_key) | toJson }}
  data:
    - secretKey: public_key
      remoteRef:
        key: gitops/opa/jwt-sign
        property: public_key
