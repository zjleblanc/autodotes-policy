# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Setup (one-time, per clone):
#   pip install pre-commit && pre-commit install
#
# `opa-check`, `opa-fmt`, and `opa-test` below run the local `opa` CLI, so
# make sure it's installed and on PATH:
# https://www.openpolicyagent.org/docs/latest/#running-opa

repos:
  # Generic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Rego linting (Regal, the official OPA Rego linter)
  # https://github.com/open-policy-agent/regal
  - repo: https://github.com/open-policy-agent/regal
    rev: v0.43.0
    hooks:
      - id: regal-lint

  # Rego syntax / strict-mode checks and formatting
  - repo: local
    hooks:
      - id: opa-check
        name: opa check --strict
        description: Validate Rego syntax and strict-mode compliance
        entry: opa check --strict
        language: system
        files: \.rego$

      - id: opa-fmt
        name: opa fmt --fail
        description: Ensure Rego files are formatted with `opa fmt`
        entry: opa fmt --fail --list
        language: system
        files: \.rego$

      - id: opa-test
        name: opa test
        description: Run OPA unit tests against example payloads (see tests/)
        entry: opa test policies/ tests/data/ -v
        language: system
        files: ^(policies/.*\.rego|tests/data/.*\.json)$
        pass_filenames: false
